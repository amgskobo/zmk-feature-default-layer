syntax = "proto3";

package cormoran.default_layer;

// `value` fields use a shared sentinel encoding (also used by custom
// settings): >=0 is a keymap layer index within the configurable range,
// -1 means use the keymap default, -2 (endpoint values only) means "resolve via the
// per-OS mapping using the OS detected for this endpoint".
message GetStateRequest {}

message SetEndpointLayerRequest {
    uint32 endpoint_index = 1;
    int32 value = 2;
}

// os: enum zmk_os from zmk-feature-os-detection (0=unknown, 1=windows,
// 2=macos, 3=linux, 4=ios, 5=android). value must not be -2 (OS detection is
// not a valid value inside the per-OS mapping itself).
message SetOsLayerRequest {
    uint32 os = 1;
    int32 value = 2;
}

message EndpointState {
    uint32 index = 1;
    bool is_usb = 2;
    uint32 ble_profile_index = 3;
    int32 value = 4;
}

message OsLayerState {
    uint32 os = 1;
    int32 value = 2;
}

// The optional sub-message distinguishes a single-layer range 0..0 from an
// older firmware that does not advertise its range.
message LayerRange {
    uint32 min_index = 1;
    uint32 max_index = 2;
}

// Present even when no explicit layer is currently assignable. An index must
// name a live layer at or above the current global default and be in range.
message AvailableLayers { repeated uint32 indices = 1; }

message StateResponse {
    repeated EndpointState endpoints = 1;
    repeated OsLayerState os_layers = 2;
    uint32 active_endpoint_index = 3;
    uint32 current_os = 4;
    int32 resolved_layer = 5;
    uint32 layer_count = 6;
    bool os_detection_available = 7;
    LayerRange configurable_range = 8;
    AvailableLayers available_layers = 9;
    // resolved_layer is the desired mapping. A coalesced/in-flight update may
    // still be waiting for its system-workqueue application.
    bool application_pending = 10;
}

message ErrorResponse {
    string message = 1;
    // A failed save can retain new runtime values. Clients should display this
    // state while still reporting the error; absence preserves older servers.
    StateResponse state = 2;
}

message Request {
    oneof request_type {
        GetStateRequest get_state = 1;
        SetEndpointLayerRequest set_endpoint_layer = 2;
        SetOsLayerRequest set_os_layer = 3;
    }
}

message Response {
    oneof response_type {
        ErrorResponse error = 1;
        StateResponse state = 2;
    }
}
